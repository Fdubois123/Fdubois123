<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120" fill="none">
  <style>
    .track {
      animation: scroll 25s linear infinite;
    }
    .track-reverse {
      animation: scroll-reverse 25s linear infinite;
    }
    .marquee-container:hover .track,
    .marquee-container:hover .track-reverse {
      animation-play-state: paused;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes scroll-reverse {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }
  </style>

  <g class="marquee-container">
    <!-- Clip area -->
    <defs>
      <clipPath id="clip">
        <rect width="850" height="120" rx="12" />
      </clipPath>
    </defs>

    <!-- Background Bar -->
    <rect width="850" height="120" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />

    <!-- Top Track (Frontend & Languages) -->
    <g clip-path="url(#clip)">
      <g class="track" transform="translate(0, 12)">
        <!-- Set 1 -->
        <image href="https://skillicons.dev/icons?i=react,nextjs,typescript,javascript,html,css,tailwind,vite,redux,sass,threejs,figma,nodejs,express,python,fastapi,flask,graphql,postman,go,java,c,cpp&amp;theme=dark" x="0" y="0" height="42" />
        <!-- Set 2 Duplicate for seamless infinite loop -->
        <image href="https://skillicons.dev/icons?i=react,nextjs,typescript,javascript,html,css,tailwind,vite,redux,sass,threejs,figma,nodejs,express,python,fastapi,flask,graphql,postman,go,java,c,cpp&amp;theme=dark" x="1100" y="0" height="42" />
      </g>
    </g>

    <!-- Bottom Track (AI, Cloud, DevOps & Databases) -->
    <g clip-path="url(#clip)">
      <g class="track-reverse" transform="translate(0, 64)">
        <!-- Set 1 -->
        <image href="https://skillicons.dev/icons?i=pytorch,tensorflow,opencv,scikitlearn,numpy,pandas,matlab,r,postgres,mongodb,mysql,redis,docker,kubernetes,aws,gcp,git,github,githubactions,linux,vscode,vercel&amp;theme=dark" x="0" y="0" height="42" />
        <!-- Set 2 Duplicate for seamless infinite loop -->
        <image href="https://skillicons.dev/icons?i=pytorch,tensorflow,opencv,scikitlearn,numpy,pandas,matlab,r,postgres,mongodb,mysql,redis,docker,kubernetes,aws,gcp,git,github,githubactions,linux,vscode,vercel&amp;theme=dark" x="1100" y="0" height="42" />
      </g>
    </g>
  </g>
</svg>
